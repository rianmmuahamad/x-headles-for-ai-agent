[package]
name = "xhl-core"
description = "libxhl — domain, driver, store, dan transport X Headless"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Impersonasi TLS (JA3/JA4) via wreq. Memerlukan cmake, clang, libclang, dan
# nasm untuk membangun BoringSSL; karena itu tidak aktif secara default.
impersonate = ["dep:wreq", "dep:wreq-util"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
uuid.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
async-trait.workspace = true
scraper.workspace = true
regex.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
wreq = { workspace = true, optional = true }
wreq-util = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true